# Reverse proxy de l'interface : fichiers statiques, API et temps réel à la même adresse.

# WebSocket : « Connection: upgrade » seulement quand le client le demande.
map $http_upgrade $connexion_upgrade {
    default upgrade;
    ""      close;
}

# Connexions temps réel simultanées par adresse IP (contrat §7, v12). Refusées ici, elles
# n'occupent même pas un thread de l'API ; l'API applique le même plafond derrière.
limit_conn_zone $binary_remote_addr zone=temps_reel:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API, santé, documentation : transmis au back --------------------------------
    location ~ ^/(api/|apidoc|openapi|health$) {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Le back lit ces en-têtes (PROXIES_DE_CONFIANCE=1) pour connaître le vrai client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # --- Temps réel (Socket.IO) --------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connexion_upgrade;
        limit_conn temps_reel 20;
        limit_conn_status 429;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Un flux ne se met pas en tampon : les messages doivent partir tout de suite.
        proxy_buffering off;
        # Le serveur envoie un ping toutes les 20 s : 60 s sans rien reçu = connexion morte.
        # Doit rester SUPÉRIEUR à l'intervalle du heartbeat (SOCKET_PING_INTERVALLE_SECONDES).
        proxy_read_timeout 60s;
    }

    # --- Fichiers construits : nom à empreinte, donc cache d'un an ----------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- L'application : toute autre adresse retombe sur index.html (routage côté navigateur)
    location / {
        try_files $uri /index.html;
        # index.html référence les fichiers à empreinte : il doit être revalidé à chaque visite.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Politique de contenu de l'interface : rien d'extérieur à elle-même.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
